[package]
name = "candle-rush"
version = "0.1.0"
description = "Call the next SOL/USD move on a MagicBlock Ephemeral Rollup; streaks open VRF loot"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "candle_rush"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
